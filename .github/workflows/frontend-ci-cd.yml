name: Frontend CI/CD

on:
  push:
    branches: ['main', 'master']
    paths:
      - 'frontend/**'
      - 'docker/nginx/**'
      - '.github/workflows/frontend-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check text integrity
        working-directory: frontend
        run: npm run check:text

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Export image
        id: image
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      CENTOS_HOST: ${{ vars.CENTOS_HOST }}
      CENTOS_USER: ${{ vars.CENTOS_USER }}
      CENTOS_SSH_KEY: ${{ secrets.CENTOS_SSH_KEY }}
      CENTOS_SSH_PORT: ${{ vars.CENTOS_SSH_PORT }}
      CENTOS_APP_DIR: ${{ vars.CENTOS_APP_DIR }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
    steps:
      - name: Deploy frontend on CentOS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.CENTOS_HOST }}
          username: ${{ env.CENTOS_USER }}
          key: ${{ env.CENTOS_SSH_KEY }}
          port: ${{ env.CENTOS_SSH_PORT }}
          envs: CENTOS_APP_DIR,FRONTEND_IMAGE,GHCR_USERNAME
          script: |
            set -eu
            cd "$CENTOS_APP_DIR"
            if grep -q '^FRONTEND_IMAGE=' .env; then
              sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_IMAGE}|" .env
            else
              printf '\nFRONTEND_IMAGE=%s\n' "$FRONTEND_IMAGE" >> .env
            fi
            docker compose --env-file .env -f docker-compose.prod.yml pull frontend
            docker compose --env-file .env -f docker-compose.prod.yml up -d --no-deps --no-build frontend
            docker compose --env-file .env -f docker-compose.prod.yml ps frontend
        env:
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.image }}
