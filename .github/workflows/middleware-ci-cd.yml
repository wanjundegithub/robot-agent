name: Middleware Deploy

on:
  push:
    branches: [main, master]
    paths:
      - docker-compose.yml
      - docker-compose.prod.yml
      - deploy/**
      - .github/workflows/middleware-ci-cd.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          FRONTEND_IMAGE=robot-agent/frontend:local \
          JAVA_BACKEND_IMAGE=robot-agent/java-backend:local \
          PYTHON_AI_IMAGE=robot-agent/python-ai:local \
          MYSQL_ROOT_PASSWORD=root \
          docker compose -f docker-compose.prod.yml config >/tmp/docker-compose.prod.yml
          docker compose -f docker-compose.yml config >/tmp/docker-compose.yml

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    env:
      CENTOS_HOST: ${{ vars.CENTOS_HOST }}
      CENTOS_USER: ${{ vars.CENTOS_USER }}
      CENTOS_SSH_KEY: ${{ secrets.CENTOS_SSH_KEY }}
      CENTOS_SSH_PORT: ${{ vars.CENTOS_SSH_PORT }}
      CENTOS_APP_DIR: ${{ vars.CENTOS_APP_DIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure app directory exists
        if: ${{ vars.CENTOS_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.CENTOS_HOST }}
          username: ${{ env.CENTOS_USER }}
          key: ${{ env.CENTOS_SSH_KEY }}
          port: ${{ env.CENTOS_SSH_PORT }}
          envs: CENTOS_APP_DIR
          script: mkdir -p "$CENTOS_APP_DIR"

      - name: Copy compose and deploy files
        if: ${{ vars.CENTOS_HOST != '' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.CENTOS_HOST }}
          username: ${{ env.CENTOS_USER }}
          key: ${{ env.CENTOS_SSH_KEY }}
          port: ${{ env.CENTOS_SSH_PORT }}
          source: "docker-compose.prod.yml,deploy/scripts/deploy-service.sh,deploy/scripts/deploy-stack.sh,deploy/scripts/deploy-middleware.sh,deploy/scripts/update-image.sh"
          target: ${{ env.CENTOS_APP_DIR }}
          overwrite: true

      - name: Deploy middleware on CentOS
        if: ${{ vars.CENTOS_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.CENTOS_HOST }}
          username: ${{ env.CENTOS_USER }}
          key: ${{ env.CENTOS_SSH_KEY }}
          port: ${{ env.CENTOS_SSH_PORT }}
          envs: CENTOS_APP_DIR
          script: |
            set -eu
            cd "${CENTOS_APP_DIR}"
            docker compose --env-file .env -f docker-compose.prod.yml up -d --no-build mysql redis pgvector
            docker compose --env-file .env -f docker-compose.prod.yml ps mysql redis pgvector
