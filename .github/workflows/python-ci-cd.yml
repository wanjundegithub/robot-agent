name: Python AI CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - python-ai/**
      - .github/workflows/python-ci-cd.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/python-ai

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-ai/requirements.txt

      - name: Install dependencies
        working-directory: python-ai
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: python-ai
        run: pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: python-ai/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Export image
        id: image
        run: echo "image=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      CENTOS_HOST: ${{ vars.CENTOS_HOST }}
      CENTOS_USER: ${{ vars.CENTOS_USER }}
      CENTOS_SSH_KEY: ${{ secrets.CENTOS_SSH_KEY }}
      CENTOS_SSH_PORT: ${{ vars.CENTOS_SSH_PORT }}
      CENTOS_APP_DIR: ${{ vars.CENTOS_APP_DIR }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - name: Deploy Python AI on CentOS
        if: ${{ vars.CENTOS_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.CENTOS_HOST }}
          username: ${{ env.CENTOS_USER }}
          key: ${{ env.CENTOS_SSH_KEY }}
          port: ${{ env.CENTOS_SSH_PORT }}
          envs: CENTOS_APP_DIR,PYTHON_AI_IMAGE,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd "$CENTOS_APP_DIR"
            if [ -n "${GHCR_USERNAME:-}" ] && [ -n "${GHCR_TOKEN:-}" ]; then
              printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin >/dev/null
            fi
            if grep -q '^PYTHON_AI_IMAGE=' .env; then
              sed -i "s|^PYTHON_AI_IMAGE=.*|PYTHON_AI_IMAGE=${PYTHON_AI_IMAGE}|" .env
            else
              printf '\nPYTHON_AI_IMAGE=%s\n' "$PYTHON_AI_IMAGE" >> .env
            fi
            docker compose --env-file .env -f docker-compose.prod.yml pull python-ai
            docker compose --env-file .env -f docker-compose.prod.yml up -d --no-deps --no-build python-ai
            docker compose --env-file .env -f docker-compose.prod.yml ps python-ai
        env:
          PYTHON_AI_IMAGE: ${{ needs.build-and-push.outputs.image }}
