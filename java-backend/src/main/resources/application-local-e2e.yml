server:
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: ${ROBOT_DB_URL:jdbc:mysql://localhost:3306/robot_agent?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${ROBOT_DB_USERNAME:root}
    password: ${ROBOT_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  file:
    name: logs/java-backend.log
  pattern:
    level: "%5p [corr:%X{correlationId:-}] [req:%X{requestId:-}]"
  level:
    robot.agent: INFO

robot:
  gateway:
    port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
