name: robot-agent

services:
  frontend:
    image: ${FRONTEND_IMAGE:-robot-agent/frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: robot-agent-frontend
    depends_on:
      java-backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./deploy/frontend/config/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  java-backend:
    image: ${JAVA_BACKEND_IMAGE:-robot-agent/java-backend:local}
    build:
      context: .
      dockerfile: java-backend/Dockerfile
    container_name: robot-agent-java-backend
    environment:
      ROBOT_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-robot_agent}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
      ROBOT_DB_USERNAME: root
      ROBOT_DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      ROBOT_PYTHON_BASE_URL: http://python-ai:8000
      ROBOT_SERVER_PORT: 8080
      ROBOT_GATEWAY_PORT: 8091
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-robot-knowledge}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-robot}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-robot-knowledge-secret}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0}
    depends_on:
      mysql:
        condition: service_healthy
      python-ai:
        condition: service_healthy
      minio:
        condition: service_healthy
    expose:
      - "8080"
      - "8091"
    restart: unless-stopped

  python-ai:
    image: ${PYTHON_AI_IMAGE:-robot-agent/python-ai:local}
    build:
      context: .
      dockerfile: python-ai/Dockerfile
    container_name: robot-agent-python-ai
    environment:
      ROBOT_REDIS_URL: redis://redis:6379/0
      ROBOT_REDIS_ENABLED: ${ROBOT_REDIS_ENABLED:-true}
      ROBOT_VECTOR_DSN: postgresql://${POSTGRES_USER:-robot}:${POSTGRES_PASSWORD:-robot}@pgvector:5432/${POSTGRES_DB:-robot_vector}
      ROBOT_VECTOR_ENABLED: ${ROBOT_VECTOR_ENABLED:-true}
    depends_on:
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: robot-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-robot_agent}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: robot-agent-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: robot-agent-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-robot_vector}
      POSTGRES_USER: ${POSTGRES_USER:-robot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robot}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: robot-agent-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-robot}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-robot-knowledge-secret}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  pgvector-data:
  minio-data:
