name: robot-agent

services:
  frontend:
    image: crpi-30e9if32nlglqiu7.cn-shanghai.personal.cr.aliyuncs.com/robot-namespace/robot-repo-frontend:latest
    container_name: robot-agent-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - /data/docker-data/frontend/config/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /data/docker-data/frontend/logs:/var/log/nginx

  java-backend:
    image: crpi-30e9if32nlglqiu7.cn-shanghai.personal.cr.aliyuncs.com/robot-namespace/robot-repo-backend:latest
    container_name: robot-agent-java-backend
    expose:
      - "8080"
      - "8091"
    volumes:
      - /data/docker-data/java-backend/config:/app/config:ro
      - /data/docker-data/java-backend/logs:/app/logs
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-robot-knowledge}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-robot}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-robot-knowledge-secret}

  python-ai:
    image: crpi-30e9if32nlglqiu7.cn-shanghai.personal.cr.aliyuncs.com/robot-namespace/robot-repo-python-ai:latest
    container_name: robot-agent-python-ai
    expose:
      - "8000"
    volumes:
      - /data/docker-data/python-ai/logs:/logs

  mysql:
    image: mysql:8.0
    container_name: robot-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-robot_agent}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      - /data/docker-data/mysql/config:/etc/mysql/conf.d:ro
      - /data/docker-data/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: robot-agent-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - /data/docker-data/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: robot-agent-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-robot_vector}
      POSTGRES_USER: ${POSTGRES_USER:-robot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-robot}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - /data/docker-data/pgvector/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    container_name: robot-agent-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-robot}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-robot-knowledge-secret}
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - /data/docker-data/minio/data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
